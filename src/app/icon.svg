<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#111827"/>
  <!-- Pediment triangle -->
  <polygon points="50,18 15,38 85,38" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <!-- Circle medallion in pediment -->
  <circle cx="50" cy="30" r="4" fill="#ffffff"/>
  <!-- Arch roof bar -->
  <rect x="18" y="38" width="64" height="6" fill="#ffffff"/>
  <!-- Columns -->
  <rect x="22" y="44" width="6" height="34" fill="#ffffff"/>
  <rect x="33" y="44" width="5" height="34" fill="#ffffff"/>
  <rect x="62" y="44" width="5" height="34" fill="#ffffff"/>
  <rect x="72" y="44" width="6" height="34" fill="#ffffff"/>
  <!-- Center Arch -->
  <path d="M 40 78 V 56 A 10 10 0 0 1 60 56 V 78 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- Base steps -->
  <rect x="15" y="78" width="70" height="4" fill="#ffffff"/>
  <rect x="12" y="82" width="76" height="4" fill="#ffffff"/>
</svg>
